dataset:
  openml_name: mnist_784
  version: 1
  expected_samples: 70000
  scale_pixels_to_unit_interval: true
  random_seed: 42
execution:
  umap_repeats: 1
  n_jobs: -1
  silhouette_sample_size: 2000
  silhouette_seed: 42
  scoring_profile: legacy_dimple
  fit_include_noise: false
umap_families:
  primary:
    n_neighbors: 30
    min_dist: 0.0
    n_components: 3
    metric: euclidean
    spread: 1.0
    learning_rate: 1.0
    repulsion_strength: 1.0
    negative_sample_rate: 5
    local_connectivity: 1.0
    set_op_mix_ratio: 1.0
    random_state: 42
    densmap: true
  alternative:
    n_neighbors: 15
    min_dist: 0.1
    n_components: 3
    metric: cosine
    spread: 1.0
    learning_rate: 1.0
    repulsion_strength: 1.0
    negative_sample_rate: 5
    local_connectivity: 1.0
    set_op_mix_ratio: 1.0
    random_state: 42
    densmap: false
named_configurations:
  reported_pqtl_inspired:
    umap_family: primary
    min_cluster_size: 10
    min_samples: 3
    cluster_selection_epsilon: 0.0
    cluster_selection_persistence: 0.0
    cluster_selection_method: eom
    alpha: 1.0
    allow_single_cluster: false
    max_cluster_size: 300
    metric: euclidean
  dev_compatible_baseline:
    umap_family: primary
    min_cluster_size: 5
    min_samples: 2
    cluster_selection_epsilon: 0.0
    cluster_selection_persistence: 0.0
    cluster_selection_method: eom
    alpha: 1.0
    allow_single_cluster: false
    max_cluster_size: 0
    metric: euclidean
  eom_restrictive_max:
    umap_family: primary
    min_cluster_size: 20
    min_samples: 5
    cluster_selection_epsilon: 0.0
    cluster_selection_persistence: 0.0
    cluster_selection_method: eom
    alpha: 1.0
    allow_single_cluster: false
    max_cluster_size: 300
    metric: euclidean
  leaf_unrestricted:
    umap_family: primary
    min_cluster_size: 20
    min_samples: 5
    cluster_selection_epsilon: 0.0
    cluster_selection_persistence: 0.0
    cluster_selection_method: leaf
    alpha: 1.0
    allow_single_cluster: false
    max_cluster_size: 0
    metric: euclidean
  eom_unrestricted:
    umap_family: primary
    min_cluster_size: 20
    min_samples: 5
    cluster_selection_epsilon: 0.0
    cluster_selection_persistence: 0.0
    cluster_selection_method: eom
    alpha: 1.0
    allow_single_cluster: false
    max_cluster_size: 0
    metric: euclidean
expanded_search:
  umap_family: [primary, alternative]
  min_cluster_size: [10, 20, 50]
  min_samples: [3, 5]
  cluster_selection_epsilon: [0.0, 0.05]
  cluster_selection_persistence: [0.0]
  cluster_selection_method: [eom, leaf]
  alpha: [1.0]
  allow_single_cluster: [false]
  max_cluster_size: [0, 300]
  metric: [euclidean]

