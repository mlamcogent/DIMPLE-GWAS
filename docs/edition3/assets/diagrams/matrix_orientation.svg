<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
  <title id="title">Matrix orientation in DIMPLE-GWAS</title><desc id="desc">The input table has variant rows, metadata columns, and phenotype vector columns. After metadata removal and optional transformation, the analysis matrix is transposed so phenotype vectors become the rows clustered by the pipeline.</desc>
  <defs><style>.h{font:700 24px Arial;fill:#17324d}.t{font:18px Arial;fill:#243746}.s{font:15px Arial;fill:#4b5563}.meta{fill:#e5e7eb;stroke:#6b7280}.val{fill:#dceaf5;stroke:#235789}.arr{stroke:#235789;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#235789"/></marker></defs>
  <text x="550" y="38" text-anchor="middle" class="h">The rows clustered are phenotype-associated vectors, not variants</text>
  <text x="220" y="82" text-anchor="middle" class="t">Input table: variants by columns</text>
  <rect x="60" y="105" width="100" height="52" class="meta"/><rect x="160" y="105" width="100" height="52" class="meta"/><rect x="260" y="105" width="100" height="52" class="val"/><rect x="360" y="105" width="100" height="52" class="val"/>
  <text x="110" y="137" text-anchor="middle" class="s">CHR</text><text x="210" y="137" text-anchor="middle" class="s">SNP</text><text x="310" y="137" text-anchor="middle" class="s">IDP A</text><text x="410" y="137" text-anchor="middle" class="s">IDP B</text>
  <g class="val"><rect x="260" y="157" width="100" height="46"/><rect x="360" y="157" width="100" height="46"/><rect x="260" y="203" width="100" height="46"/><rect x="360" y="203" width="100" height="46"/><rect x="260" y="249" width="100" height="46"/><rect x="360" y="249" width="100" height="46"/></g>
  <g class="meta"><rect x="60" y="157" width="100" height="46"/><rect x="160" y="157" width="100" height="46"/><rect x="60" y="203" width="100" height="46"/><rect x="160" y="203" width="100" height="46"/><rect x="60" y="249" width="100" height="46"/><rect x="160" y="249" width="100" height="46"/></g>
  <text x="110" y="185" text-anchor="middle" class="s">1</text><text x="210" y="185" text-anchor="middle" class="s">rs1</text><text x="310" y="185" text-anchor="middle" class="s">0.8</text><text x="410" y="185" text-anchor="middle" class="s">-0.2</text>
  <text x="110" y="231" text-anchor="middle" class="s">1</text><text x="210" y="231" text-anchor="middle" class="s">rs2</text><text x="310" y="231" text-anchor="middle" class="s">0.1</text><text x="410" y="231" text-anchor="middle" class="s">0.4</text>
  <text x="110" y="277" text-anchor="middle" class="s">2</text><text x="210" y="277" text-anchor="middle" class="s">rs3</text><text x="310" y="277" text-anchor="middle" class="s">-0.6</text><text x="410" y="277" text-anchor="middle" class="s">-0.5</text>
  <text x="550" y="178" text-anchor="middle" class="s">drop metadata,</text><text x="550" y="202" text-anchor="middle" class="s">validate, transform,</text><text x="550" y="226" text-anchor="middle" class="s">transpose</text><path d="M490 258 H610" class="arr"/>
  <text x="820" y="82" text-anchor="middle" class="t">Working matrix: vectors by variants</text>
  <rect x="660" y="105" width="120" height="52" class="val"/><rect x="780" y="105" width="90" height="52" class="val"/><rect x="870" y="105" width="90" height="52" class="val"/><rect x="960" y="105" width="90" height="52" class="val"/>
  <text x="720" y="137" text-anchor="middle" class="s">object</text><text x="825" y="137" text-anchor="middle" class="s">rs1</text><text x="915" y="137" text-anchor="middle" class="s">rs2</text><text x="1005" y="137" text-anchor="middle" class="s">rs3</text>
  <g class="val"><rect x="660" y="157" width="120" height="60"/><rect x="780" y="157" width="90" height="60"/><rect x="870" y="157" width="90" height="60"/><rect x="960" y="157" width="90" height="60"/><rect x="660" y="217" width="120" height="60"/><rect x="780" y="217" width="90" height="60"/><rect x="870" y="217" width="90" height="60"/><rect x="960" y="217" width="90" height="60"/></g>
  <text x="720" y="192" text-anchor="middle" class="s">IDP A</text><text x="825" y="192" text-anchor="middle" class="s">0.8</text><text x="915" y="192" text-anchor="middle" class="s">0.1</text><text x="1005" y="192" text-anchor="middle" class="s">-0.6</text>
  <text x="720" y="252" text-anchor="middle" class="s">IDP B</text><text x="825" y="252" text-anchor="middle" class="s">-0.2</text><text x="915" y="252" text-anchor="middle" class="s">0.4</text><text x="1005" y="252" text-anchor="middle" class="s">-0.5</text>
  <rect x="140" y="370" width="820" height="120" rx="14" fill="#fff8e6" stroke="#b7791f" stroke-width="2"/>
  <text x="550" y="408" text-anchor="middle" class="t">What distance means after transposition</text><text x="550" y="440" text-anchor="middle" class="s">A distance compares two complete IDP association profiles across the aligned variant coordinates.</text><text x="550" y="468" text-anchor="middle" class="s">It does not cluster the variant rows and does not correct upstream harmonization or uncertainty problems.</text>
</svg>
