<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="560" viewBox="0 0 1150 560" role="img" aria-labelledby="title desc">
  <title id="title">Repeated seeded embeddings and concatenation</title><desc id="desc">The same prepared matrix is embedded under three seeds. Their coordinate blocks are horizontally concatenated into a larger representation used by HDBSCAN. The first block supplies display coordinates. No alignment, averaging, or consensus partition is performed.</desc>
  <defs><style>.h{font:700 24px Arial;fill:#17324d}.t{font:18px Arial;fill:#243746}.s{font:15px Arial;fill:#4b5563}.b{fill:#eef5fa;stroke:#235789;stroke-width:2}.c{fill:#edf7ed;stroke:#2f6b3f;stroke-width:2}.a{stroke:#235789;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#235789"/></marker></defs>
  <text x="575" y="38" text-anchor="middle" class="h">Several stochastic views become one concatenated representation</text>
  <rect x="35" y="170" width="175" height="100" rx="14" class="b"/><text x="122" y="208" text-anchor="middle" class="t">Prepared matrix</text><text x="122" y="238" text-anchor="middle" class="s">p vectors x v variables</text>
  <path d="M210 220 H280" class="a"/><path d="M245 220 V100 H315" class="a"/><path d="M245 220 V340 H315" class="a"/>
  <rect x="315" y="60" width="190" height="92" rx="14" class="b"/><text x="410" y="96" text-anchor="middle" class="t">UMAP seed 1</text><text x="410" y="124" text-anchor="middle" class="s">Z1: p x d</text>
  <rect x="315" y="174" width="190" height="92" rx="14" class="b"/><text x="410" y="210" text-anchor="middle" class="t">UMAP seed 2</text><text x="410" y="238" text-anchor="middle" class="s">Z2: p x d</text>
  <rect x="315" y="288" width="190" height="92" rx="14" class="b"/><text x="410" y="324" text-anchor="middle" class="t">UMAP seed r</text><text x="410" y="352" text-anchor="middle" class="s">Zr: p x d</text>
  <path d="M505 106 L635 205" class="a"/><path d="M505 220 H635" class="a"/><path d="M505 334 L635 235" class="a"/>
  <rect x="635" y="160" width="260" height="120" rx="14" class="c"/><text x="765" y="196" text-anchor="middle" class="t">Horizontal concatenation</text><text x="765" y="226" text-anchor="middle" class="s">Z = [Z1 | Z2 | ... | Zr]</text><text x="765" y="252" text-anchor="middle" class="s">shape p x (r d)</text>
  <path d="M895 220 H970" class="a"/><rect x="970" y="170" width="150" height="100" rx="14" class="b"/><text x="1045" y="208" text-anchor="middle" class="t">HDBSCAN</text><text x="1045" y="238" text-anchor="middle" class="s">fit on Z</text>
  <rect x="180" y="430" width="790" height="80" rx="12" fill="#fff8e6" stroke="#b7791f" stroke-width="2"/><text x="575" y="463" text-anchor="middle" class="t">Important: this is not alignment, averaging, bootstrapping, or formal consensus clustering.</text><text x="575" y="490" text-anchor="middle" class="s">Seed stability must be measured; the first view used for display is not the full clustering representation.</text>
</svg>
