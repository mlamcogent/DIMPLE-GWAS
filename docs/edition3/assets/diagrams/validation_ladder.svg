<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Validation ladder</title><desc id="desc">A six-step ladder ascends from artifact integrity through software regression, structural concordance, statistical stability, external biological validation, and cross-platform qualification. Passing a lower step does not imply a higher step.</desc>
  <defs><style>.h{font:700 24px Arial;fill:#17324d}.t{font:700 18px Arial;fill:white}.s{font:15px Arial;fill:#243746}.n{font:700 19px Arial;fill:#17324d}</style></defs>
  <text x="550" y="38" text-anchor="middle" class="h">Validation is a ladder, not one binary badge</text>
  <g>
    <rect x="90" y="510" width="920" height="70" rx="8" fill="#dbeafe" stroke="#235789"/><text x="130" y="553" class="n">1</text><text x="185" y="542" class="s">Artifact integrity</text><text x="185" y="566" class="s">files, schemas, counts, hashes, IDs</text>
    <rect x="170" y="425" width="840" height="70" rx="8" fill="#c7e2f5" stroke="#235789"/><text x="210" y="468" class="n">2</text><text x="265" y="457" class="s">Software regression</text><text x="265" y="481" class="s">tests, fixed fixtures, exact local replay</text>
    <rect x="250" y="340" width="760" height="70" rx="8" fill="#add5ee" stroke="#235789"/><text x="290" y="383" class="n">3</text><text x="345" y="372" class="s">Structural concordance</text><text x="345" y="396" class="s">ARI, NMI, noise agreement, Procrustes where defined</text>
    <rect x="330" y="255" width="680" height="70" rx="8" fill="#91c4e5" stroke="#235789"/><text x="370" y="298" class="n">4</text><text x="425" y="287" class="s">Statistical stability</text><text x="425" y="311" class="s">seed, parameter, metric, feature and resampling sensitivity</text>
    <rect x="410" y="170" width="600" height="70" rx="8" fill="#6eadd8" stroke="#235789"/><text x="450" y="213" class="n">5</text><text x="505" y="202" class="s">External and biological validation</text><text x="505" y="226" class="s">independent data, follow-up evidence, selection-aware claims</text>
    <rect x="490" y="85" width="520" height="70" rx="8" fill="#4b91c3" stroke="#235789"/><text x="530" y="128" class="n">6</text><text x="585" y="117" class="t">Cross-platform qualification</text><text x="585" y="141" class="t">Linux, Docker, architecture and cloud comparisons</text>
  </g>
  <text x="550" y="622" text-anchor="middle" class="s">Stage 1 closes the lower software and fixed-fixture steps with limits; it does not automatically climb the rest.</text>
</svg>
