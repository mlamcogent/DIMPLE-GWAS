<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
  <title id="title">DIMPLE-GWAS analysis hierarchy</title><desc id="desc">Three manuscript analyses, a retained historical adapter, a separate validation workbook, and synthetic regression fixtures are shown as distinct evidence levels. The fresh 164-IDP thousand-seed refit is pending.</desc>
  <defs><style>.h{font:700 24px Arial;fill:#17324d}.t{font:700 18px Arial;fill:#243746}.s{font:15px Arial;fill:#4b5563}.r{fill:#f7f7f7;stroke:#6b7280;stroke-width:2}.v{fill:#eef5fa;stroke:#235789;stroke-width:2}.p{fill:#fff8e6;stroke:#b7791f;stroke-width:2}</style></defs>
  <text x="590" y="38" text-anchor="middle" class="h">Counts belong to distinct analyses and evidence roles</text>
  <rect x="45" y="82" width="330" height="135" rx="14" class="r"/><text x="210" y="116" text-anchor="middle" class="t">2,315-IDP primary analysis</text><text x="210" y="146" text-anchor="middle" class="s">reported: 15 clusters, 153 noise</text><text x="210" y="174" text-anchor="middle" class="s">model table retained; raw matrix absent</text><text x="210" y="198" text-anchor="middle" class="s">status: reported, score reconstructed</text>
  <rect x="425" y="82" width="330" height="135" rx="14" class="r"/><text x="590" y="116" text-anchor="middle" class="t">459-IDP secondary analysis</text><text x="590" y="146" text-anchor="middle" class="s">reported: 6 clusters, 16 noise</text><text x="590" y="174" text-anchor="middle" class="s">raw/model artifacts absent; parameters conflict</text><text x="590" y="198" text-anchor="middle" class="s">status: reported only</text>
  <rect x="805" y="82" width="330" height="135" rx="14" class="v"/><text x="970" y="116" text-anchor="middle" class="t">164-IDP secondary analysis</text><text x="970" y="146" text-anchor="middle" class="s">retained: 5 clusters, 102 noise</text><text x="970" y="174" text-anchor="middle" class="s">exact input, labels and model table retained</text><text x="970" y="198" text-anchor="middle" class="s">manual selected row 16</text>
  <rect x="120" y="290" width="330" height="135" rx="14" class="v"/><text x="285" y="324" text-anchor="middle" class="t">Historical-164 adapter</text><text x="285" y="354" text-anchor="middle" class="s">exact ID matching and unchanged labels</text><text x="285" y="382" text-anchor="middle" class="s">original-space explanation; no refit</text><text x="285" y="406" text-anchor="middle" class="s">status: adapted and retained</text>
  <rect x="490" y="290" width="260" height="135" rx="14" class="r"/><text x="620" y="324" text-anchor="middle" class="t">356-row workbook</text><text x="620" y="354" text-anchor="middle" class="s">separate validation artifact</text><text x="620" y="382" text-anchor="middle" class="s">not an alternate 164 count</text><text x="620" y="406" text-anchor="middle" class="s">status: distinct evidence level</text>
  <rect x="790" y="290" width="270" height="135" rx="14" class="v"/><text x="925" y="324" text-anchor="middle" class="t">Fixed synthetic fixture</text><text x="925" y="354" text-anchor="middle" class="s">24 vectors x 80 variables</text><text x="925" y="382" text-anchor="middle" class="s">3 designed clusters, 0 noise</text><text x="925" y="406" text-anchor="middle" class="s">status: fresh software evidence</text>
  <rect x="220" y="475" width="740" height="115" rx="14" class="p"/><text x="590" y="512" text-anchor="middle" class="t">Pending gate: fresh Freeze 3 refit of the 164-IDP analysis with 1,000 seeds</text><text x="590" y="545" text-anchor="middle" class="s">Retained-label adaptation, score rescore and fixed-fixture equality are different evidence.</text><text x="590" y="571" text-anchor="middle" class="s">They do not substitute for this run.</text>
</svg>
