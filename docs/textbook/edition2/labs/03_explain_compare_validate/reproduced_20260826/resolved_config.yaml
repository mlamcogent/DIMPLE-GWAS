execution:
  candidate_jobs: 1
  compute_dbcv: true
  legacy_ensemble_seeds: false
  max_candidate_models: 0
  max_samples_silhouette: 0
  max_samples_trust: 3000
  n_jobs: 1
  n_random_states: 1
  silhouette_seed: 42
  strict: true
  top_n_models: 1
  trust_k: 10
  trust_seed: 42
  warn_candidate_count: 5000
  write_parquet: true
hdbscan:
  allow_single_cluster: false
  alpha: 1.0
  cluster_selection_epsilon: 0.0
  cluster_selection_method: eom
  cluster_selection_persistence: 0.0
  max_cluster_size: 0
  metric: euclidean
  min_cluster_size: 5
  min_samples: 2
input:
  annotation_file: benchmarks/synthetic/synthetic_annotations.csv
  annotation_index_col: index
  drop_first_n_cols: 4
  path: benchmarks/synthetic/synthetic_matrix.tsv
  sep: "\t"
  zscore_transform: none
interpretation:
  coordinate_associations: false
  coordinate_methods:
  - pearson
  force_large_matrix: false
  max_full_heatmap: 1200
  noise_policy: separate_last
  order: cluster_then_hclust
  require_complete_match: true
  similarity_metric: pearson
  top_n_associations: 100
  undefined_correlation: error
  write_similarity: true
scoring:
  custom: {}
  fit_include_noise: false
  profile: legacy_dimple
search_mode: fixed
umap:
  densmap: true
  learning_rate: 1.0
  local_connectivity: 1.0
  metric: euclidean
  min_dist: 0.0
  n_components: 3
  n_neighbors: 10
  negative_sample_rate: 5
  random_state: 42
  repulsion_strength: 1.0
  set_op_mix_ratio: 1.0
  spread: 1.0
