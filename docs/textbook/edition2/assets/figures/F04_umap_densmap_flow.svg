<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">UMAP turns local relations into a stochastic representation</title><desc id="desc">The current package delegates graph construction and optimization to umap-learn.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2f6f9f"/></marker>
<filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.12"/></filter></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="80" y="82" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#17324d">UMAP turns local relations into a stochastic representation</text>
<text x="80" y="124" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#617181">The current package delegates graph construction and optimization to umap-learn.</text>
<rect x="80" y="250" width="300" height="180" rx="18" fill="#f3f7fa" stroke="#2f6f9f" stroke-width="3" filter="url(#shadow)"/>
<text x="230.0" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d">Prepared</text>
<text x="230.0" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d">vectors</text>
<text x="230.0" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">metric determines</text>
<text x="230.0" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">neighbor ordering</text><line x1="380" y1="340" x2="500" y2="340" stroke="#2f6f9f" stroke-width="4" marker-end="url(#arrow)"/><rect x="500" y="250" width="300" height="180" rx="18" fill="#eaf5f3" stroke="#2a9d8f" stroke-width="3" filter="url(#shadow)"/>
<text x="650.0" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d">Local fuzzy</text>
<text x="650.0" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d">graph</text>
<text x="650.0" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">ρ and σ calibrate</text>
<text x="650.0" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">directed memberships</text><line x1="800" y1="340" x2="920" y2="340" stroke="#2f6f9f" stroke-width="4" marker-end="url(#arrow)"/><rect x="920" y="250" width="300" height="180" rx="18" fill="#fff7df" stroke="#c79a2b" stroke-width="3" filter="url(#shadow)"/>
<text x="1070.0" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d">Stochastic</text>
<text x="1070.0" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d">layout</text>
<text x="1070.0" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">cross-entropy</text>
<text x="1070.0" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">balances attraction</text>
<text x="1070.0" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">and repulsion</text><line x1="1220" y1="340" x2="1340" y2="340" stroke="#2f6f9f" stroke-width="4" marker-end="url(#arrow)"/><rect x="1340" y="250" width="190" height="180" rx="18" fill="#fff0ec" stroke="#e76f51" stroke-width="3" filter="url(#shadow)"/>
<text x="1435.0" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d">Coordinates</text>
<text x="1435.0" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">descriptive axes</text><rect x="450" y="550" width="700" height="42" rx="21" fill="#2a9d8f"/><text x="800.0" y="578" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="white">densMAP adds a density-regularization objective</text><rect x="335" y="640" width="930" height="42" rx="21" fill="#17324d"/><text x="800.0" y="668" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="white">Neighborhood preservation ≠ preservation of all distances or biological pathways</text>
<text x="80" y="858" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#617181">DIMPLE-GWAS Freeze 3 RC1 · Textbook Edition 2 · internal review</text>
</svg>