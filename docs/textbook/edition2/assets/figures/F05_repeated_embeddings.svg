<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Repeated seeded layouts create a concatenated geometry</title><desc id="desc">Each run contributes q coordinates; raw axis scale influences its distance contribution.</desc>
