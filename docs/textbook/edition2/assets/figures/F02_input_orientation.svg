<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Input orientation changes the unit of analysis</title><desc id="desc">A safe workflow names both the source table and the post-transposition matrix.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2f6f9f"/></marker>
<filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.12"/></filter></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="80" y="82" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#17324d">Input orientation changes the unit of analysis</text>
<text x="80" y="124" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#617181">A safe workflow names both the source table and the post-transposition matrix.</text>
<rect x="110" y="220" width="520" height="220" rx="18" fill="#eaf5f3" stroke="#2a9d8f" stroke-width="3" filter="url(#shadow)"/>
<text x="370.0" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d">Input table</text>
<text x="370.0" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">rows = variants · columns =</text>
<text x="370.0" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">phenotype identifiers</text><line x1="630" y1="330" x2="820" y2="330" stroke="#2f6f9f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="725.0" y="318.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#617181">remove metadata · validate · transform · transpose</text><rect x="820" y="220" width="650" height="220" rx="18" fill="#fff7df" stroke="#c79a2b" stroke-width="3" filter="url(#shadow)"/>
<text x="1145.0" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d">Prepared analysis matrix</text>
<text x="1145.0" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">rows = phenotype vectors · columns =</text>
<text x="1145.0" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">retained variant dimensions</text><rect x="290" y="540" width="1020" height="42" rx="21" fill="#17324d"/><text x="800.0" y="568" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="white">Cluster membership belongs to phenotype vectors, never to arbitrary row numbers</text><rect x="430" y="645" width="740" height="105" rx="18" fill="#fff0ec" stroke="#e76f51" stroke-width="3" filter="url(#shadow)"/>
<text x="800.0" y="687" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d">Orientation test</text>
<text x="800.0" y="725" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">Identifier axis + numeric analysis axis +</text>
<text x="800.0" y="750" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">expected output identifiers must agree</text>
<text x="80" y="858" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#617181">DIMPLE-GWAS Freeze 3 RC1 · Textbook Edition 2 · internal review</text>
</svg>