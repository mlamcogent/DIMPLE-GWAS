<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Validation is layered and claim-specific</title><desc id="desc">Each rung requires evidence appropriate to that claim; lower layers remain necessary but insufficient.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2f6f9f"/></marker>
<filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.12"/></filter></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="80" y="82" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#17324d">Validation is layered and claim-specific</text>
<text x="80" y="124" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#617181">Each rung requires evidence appropriate to that claim; lower layers remain necessary but insufficient.</text>
<rect x="155" y="650" width="205" height="150" rx="18" fill="#dbeaf5" stroke="#17324d" stroke-width="3" filter="url(#shadow)"/>
<text x="257.5" y="692" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d">1. Software</text>
<text x="257.5" y="730" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">tests · schema ·</text>
<text x="257.5" y="755" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">deterministic</text>
<text x="257.5" y="780" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">contracts</text><rect x="375" y="572" width="205" height="150" rx="18" fill="#d9f0eb" stroke="#17324d" stroke-width="3" filter="url(#shadow)"/>
<text x="477.5" y="614" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d">2. Artifact</text>
<text x="477.5" y="652" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">completeness ·</text>
<text x="477.5" y="677" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">checksums ·</text>
<text x="477.5" y="702" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">identifiers</text><line x1="360" y1="647" x2="375" y2="647" stroke="#2f6f9f" stroke-width="4" marker-end="url(#arrow)"/><rect x="595" y="494" width="205" height="150" rx="18" fill="#fff1c9" stroke="#17324d" stroke-width="3" filter="url(#shadow)"/>
<text x="697.5" y="536" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d">3.</text>
<text x="697.5" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d">Structural</text>
<text x="697.5" y="604" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">replay ·</text>
<text x="697.5" y="629" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">partitions ·</text>
<text x="697.5" y="654" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">sensitivity</text><line x1="580" y1="569" x2="595" y2="569" stroke="#2f6f9f" stroke-width="4" marker-end="url(#arrow)"/><rect x="815" y="416" width="205" height="150" rx="18" fill="#fbe0d8" stroke="#17324d" stroke-width="3" filter="url(#shadow)"/>
<text x="917.5" y="458" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d">4.</text>
<text x="917.5" y="488" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d">Statistical</text>
<text x="917.5" y="526" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">uncertainty ·</text>
<text x="917.5" y="551" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">selection ·</text>
<text x="917.5" y="576" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">independent</text>
<text x="917.5" y="601" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">design</text><line x1="800" y1="491" x2="815" y2="491" stroke="#2f6f9f" stroke-width="4" marker-end="url(#arrow)"/><rect x="1035" y="338" width="205" height="150" rx="18" fill="#eadff2" stroke="#17324d" stroke-width="3" filter="url(#shadow)"/>
<text x="1137.5" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d">5.</text>
<text x="1137.5" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d">Biological</text>
<text x="1137.5" y="448" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">mechanism ·</text>
<text x="1137.5" y="473" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">enrichment ·</text>
<text x="1137.5" y="498" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">external</text>
<text x="1137.5" y="523" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">coherence</text><line x1="1020" y1="413" x2="1035" y2="413" stroke="#2f6f9f" stroke-width="4" marker-end="url(#arrow)"/><rect x="1255" y="260" width="205" height="150" rx="18" fill="#dfe5eb" stroke="#17324d" stroke-width="3" filter="url(#shadow)"/>
<text x="1357.5" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d">6. Cross-</text>
<text x="1357.5" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d">platform &amp;</text>
<text x="1357.5" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17324d">external</text>
<text x="1357.5" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">Docker/Linux/cloud</text>
<text x="1357.5" y="425" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1e2933">· new cohorts</text><line x1="1240" y1="335" x2="1255" y2="335" stroke="#2f6f9f" stroke-width="4" marker-end="url(#arrow)"/><rect x="410" y="755" width="780" height="42" rx="21" fill="#17324d"/><text x="800.0" y="783" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="white">Evidence does not automatically rise from one layer to the next</text>
<text x="80" y="858" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#617181">DIMPLE-GWAS Freeze 3 RC1 · Textbook Edition 2 · internal review</text>
</svg>