<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">A Cartesian grid creates auditable candidates</title><desc id="desc">Representation work is shared within a UMAP family; every HDBSCAN setting remains a distinct candidate.</desc>
