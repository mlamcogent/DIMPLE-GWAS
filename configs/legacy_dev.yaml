# Standard mode reproduces the authoritative dev defaults as closely as possible.
search_mode: standard
input:
  path: test_data/test_dat.csv
  drop_first_n_cols: 4
  zscore_transform: none
  annotation_file: test_data/IDP_KEY.csv
  annotation_index_col: index
umap:
  n_neighbors: 30
  min_dist: 0.0
  n_components: 3
  metric: euclidean
  spread: 1.0
  learning_rate: 1.0
  repulsion_strength: 1.0
  negative_sample_rate: 5
  local_connectivity: 1.0
  set_op_mix_ratio: 1.0
  random_state: 42
  densmap: true
hdbscan:
  min_cluster_size: {start: 5, stop: 50, step: 1}
  min_samples: {start: 2, stop: 20, step: 1}
  cluster_selection_epsilon: {start: 0, stop: 3, step: 1}
  cluster_selection_persistence: 0.0
  cluster_selection_method: eom
  alpha: 1.0
  allow_single_cluster: false
  max_cluster_size: 0
  metric: euclidean
execution:
  n_random_states: 1000
  n_jobs: -1
  candidate_jobs: 1
  top_n_models: 20
  legacy_ensemble_seeds: true
scoring:
  profile: legacy_dimple
  fit_include_noise: false

