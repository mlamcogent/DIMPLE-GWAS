search_mode: custom
umap:
  n_neighbors: [15, 30]
  min_dist: [0.0, 0.1]
  metric: [euclidean, cosine]
hdbscan:
  min_cluster_size: [5, 10, 20]
  min_samples: [2, 5]
  cluster_selection_epsilon: [0.0, 0.05]
  cluster_selection_persistence: 0.0
  cluster_selection_method: [eom, leaf]
  alpha: 1.0
  allow_single_cluster: false
  max_cluster_size: [0, 100]
  metric: euclidean
scoring:
  profile: custom
  fit_include_noise: false
  custom:
    silhouette: {weight: 0.45, direction: maximize}
    noise_fraction: {weight: 0.25, direction: minimize}
    largest_cluster_fraction: {weight: 0.20, direction: minimize}
    hdbscan_persistence_mean: {weight: 0.10, direction: maximize}
execution:
  n_random_states: 10
  top_n_models: 20

