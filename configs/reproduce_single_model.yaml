search_mode: fixed
input:
  path: test_data/test_dat.csv
  drop_first_n_cols: 4
  zscore_transform: none
umap:
  n_neighbors: 30
  min_dist: 0.0
  n_components: 3
  metric: euclidean
  spread: 1.0
  learning_rate: 1.0
  repulsion_strength: 1.0
  negative_sample_rate: 5
  local_connectivity: 1.0
  set_op_mix_ratio: 1.0
  random_state: 42
  densmap: true
hdbscan:
  min_cluster_size: 5
  min_samples: 5
  cluster_selection_epsilon: 0.0
  cluster_selection_persistence: 0.0
  cluster_selection_method: eom
  alpha: 1.0
  allow_single_cluster: false
  max_cluster_size: 0
  metric: euclidean
execution:
  n_random_states: 1
  n_jobs: -1
  top_n_models: 1
  legacy_ensemble_seeds: false
scoring:
  profile: legacy_dimple
  fit_include_noise: false

