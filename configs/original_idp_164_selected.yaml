# Confirmed parameter contract for the published 164-IDP five-cluster result.
# Evidence: executed workflow-ver2 notebook plus the immutable final workbook.
search_mode: fixed
input:
  path: test_data/test_dat.csv
  drop_first_n_cols: 4
  sep: ","
  zscore_transform: none
  annotation_file: test_data/IDP_KEY.csv
  annotation_index_col: index
umap:
  n_neighbors: 30
  min_dist: 0.0
  n_components: 3
  metric: euclidean
  spread: 1.0
  learning_rate: 1.0
  repulsion_strength: 1.0
  negative_sample_rate: 5
  local_connectivity: 1.0
  set_op_mix_ratio: 1.0
  random_state: 42
  densmap: true
hdbscan:
  min_cluster_size: 6
  min_samples: 4
  cluster_selection_epsilon: 0.0
  cluster_selection_persistence: 0.0
  cluster_selection_method: eom
  alpha: 1.0
  allow_single_cluster: false
  max_cluster_size: 0
  metric: euclidean
execution:
  n_random_states: 1000
  n_jobs: -1
  candidate_jobs: 1
  top_n_models: 1
  legacy_ensemble_seeds: true
  write_parquet: true
  compute_dbcv: false
  strict: true
scoring:
  profile: legacy_dimple
  fit_include_noise: true
interpretation:
  similarity_metric: pearson
  order: cluster_then_hclust
  noise_policy: separate_last
  undefined_correlation: error
  require_complete_match: true
  max_full_heatmap: 1200
  write_similarity: true
  force_large_matrix: false
  coordinate_associations: false
  coordinate_methods: [pearson]
  top_n_associations: 100
